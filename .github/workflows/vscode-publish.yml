name: Publish VS Code extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Test
        run: npm test

      - name: Read extension version
        id: metadata
        run: node -p '"version=" + require("./package.json").version' >> "$GITHUB_OUTPUT"

      - name: Package extension
        run: npx @vscode/vsce package --out "starling-ai-${{ steps.metadata.outputs.version }}.vsix"

      - name: Publish to VS Code Marketplace
        run: npx @vscode/vsce publish --packagePath "starling-ai-${{ steps.metadata.outputs.version }}.vsix" -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Create GitHub release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          vsix="starling-ai-${VERSION}.vsix"
          if [[ "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          else
            tag="v${VERSION}"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$vsix" --clobber
          else
            gh release create "$tag" "$vsix" \
              --verify-tag \
              --title "Starling Agent ${VERSION}" \
              --generate-notes
          fi
